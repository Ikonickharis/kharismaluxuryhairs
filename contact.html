<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | Kharisma Luxury Hairs</title>
  <link rel="stylesheet" href="style/style.css" />
</head>
<body>
  <!-- Header -->
  <header class="sticky">
    <div class="container">
      <img src="photos/Kharisma-logo.PNG" alt="Kharisma Logo" class="logo">
      <nav id="nav">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <div id="menu-toggle">☰</div>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <section class="contact-section">
      <h2>Contact Us</h2>
      <p class="center-text">We’d love to hear from you! Send us a message below.</p>

      <form id="contactForm" class="contact-form">
        <input type="text" id="name" placeholder="Your Name" required />
        <input type="email" id="email" placeholder="Your Email" required />
        <textarea id="message" placeholder="Your Message" rows="5" required></textarea>
        <button type="submit" class="btn">Send Message</button>
        <p id="formMsg" class="form-message"></p>
      </form>

      <div class="contact-details">
        <h3>Reach Us At</h3>
        <p><strong>Email:</strong> support@kharismaluxuryhairs.com</p>
        <p><strong>Phone:</strong> +1 (123) 456-7890</p>
        <p><strong>Location:</strong> Lagos, Nigeria</p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="sticky-footer">
    <p>&copy; 2025 Kharisma Luxury Hairs. All rights reserved.</p>
  </footer>

  <script src="script/script.js"></script>
</body>
</html>
